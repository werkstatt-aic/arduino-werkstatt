<!doctype html>
<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werkstatt-Schulserver</title>
<link rel="stylesheet" href="lehrer.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">⚙</span> Werkstatt-Schulserver</div>

    <button data-view="klassen" class="on">Klassen</button>
    <button data-view="inhalte">Aufgaben &amp; Beispiele</button>

<main id="main"></main>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast"></div>
