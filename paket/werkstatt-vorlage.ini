# Vorlage für die Netzwerk-Version der Arduino-Werkstatt
# Zum Verwenden in "werkstatt.ini" umbenennen (neben "Arduino-Werkstatt starten.exe").
# Ohne diese Datei erkennt die Werkstatt selbst, ob sie im Netzwerk läuft.

# auto = Netzwerk-Version, wenn der Ordner schreibgeschützt ist oder auf einem
#        Netzwerklaufwerk liegt (Standard)
# ja   = immer Netzwerk-Version (Projekte im persönlichen Ordner)
# nein = immer wie auf dem Stick (Projekte im Ordner "Projekte" hier)
Netzwerkmodus = auto

# Wo die Projekte der Schüler gespeichert werden. Ohne Angabe:
# Dokumente\Arduino-Werkstatt (auch wenn "Dokumente" auf das Homelaufwerk umgeleitet ist).
# Beispiele:
# Projektordner = H:\Arduino-Werkstatt
# Projektordner = %USERPROFILE%\Documents\Arduino-Werkstatt
